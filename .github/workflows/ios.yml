# Builds the App Store version of Genogram on a Mac at GitHub and uploads it to App Store Connect (store branch only; the website is not affected).
# Run it by hand: Actions tab > "iOS build and upload" > Run workflow. About 15 minutes later the build appears in TestFlight.
# Needs four repository secrets (Settings > Secrets and variables > Actions):
#   ASC_KEY_ID       App Store Connect API key ID (Users and Access > Integrations > App Store Connect API; role: Admin)
#   ASC_ISSUER_ID    Issuer ID shown above the key list on the same page
#   ASC_KEY_P8       The whole text of the downloaded AuthKey_XXXX.p8 file
#   APPLE_TEAM_ID    10-character Team ID (developer.apple.com > Account > Membership details)
# Signing is automatic: Xcode uses the API key to make the certificate and profile it needs, so nothing else is stored here.
# The build number is the run number, so every upload is accepted; the version (1.8.1) comes from Xcode's MARKETING_VERSION.
name: iOS build and upload
on:
  workflow_dispatch:
    inputs:
      upload:
        description: 'Upload to App Store Connect (untick to only check that it builds)'
        type: boolean
        default: true
jobs:
  build:
    runs-on: macos-26
    defaults: { run: { working-directory: native } }
    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 22 }
      - name: Check the secrets are set
        run: |
          for v in ASC_KEY_ID ASC_ISSUER_ID TEAM_ID; do [ -n "${!v}" ] || { echo "::error::Secret for $v is missing"; exit 1; }; done
      - name: Use the newest Xcode
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)" && xcodebuild -version
      - run: npm ci
      - run: npm run sync -- ios
      - name: Save the API key
        env: { ASC_KEY_P8: '${{ secrets.ASC_KEY_P8 }}' }
        run: |
          mkdir -p ~/.appstoreconnect/private_keys
          printf '%s\n' "$ASC_KEY_P8" > ~/.appstoreconnect/private_keys/AuthKey_$ASC_KEY_ID.p8
          echo "KEY_PATH=$HOME/.appstoreconnect/private_keys/AuthKey_$ASC_KEY_ID.p8" >> $GITHUB_ENV
      - name: Archive
        run: |
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Release \
            -destination 'generic/platform=iOS' -archivePath $RUNNER_TEMP/Genogram.xcarchive \
            DEVELOPMENT_TEAM=$TEAM_ID CODE_SIGN_STYLE=Automatic CURRENT_PROJECT_VERSION=${{ github.run_number }} \
            -allowProvisioningUpdates -authenticationKeyPath "$KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            archive
      - name: Check the app (bundled files, app ID, version)
        run: |
          APP=$RUNNER_TEMP/Genogram.xcarchive/Products/Applications/App.app
          ls $APP/public/index.html $APP/public/js/native.js $APP/public/js/app.js
          /usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' $APP/Info.plist | grep -qx com.isaymotion.genogram
          echo "Version $(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' $APP/Info.plist) build $(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' $APP/Info.plist)"
      - name: Export and upload to App Store Connect
        run: |
          DEST=export; [ "${{ inputs.upload }}" = "true" ] && DEST=upload
          cat > $RUNNER_TEMP/ExportOptions.plist <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>$DEST</string>
            <key>signingStyle</key><string>automatic</string>
            <key>teamID</key><string>$TEAM_ID</string>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict></plist>
          PLIST
          xcodebuild -exportArchive -archivePath $RUNNER_TEMP/Genogram.xcarchive \
            -exportOptionsPlist $RUNNER_TEMP/ExportOptions.plist -exportPath $RUNNER_TEMP/out \
            -allowProvisioningUpdates -authenticationKeyPath "$KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID"
      - if: always()
        run: rm -f ~/.appstoreconnect/private_keys/*.p8
