# Builds the Google Play version of Genogram on GitHub's servers (store branch only; the website is not affected).
# Result: Actions tab > latest "Android build" run > Artifacts > genogram-android (a test .apk and an unsigned .aab).
name: Android build
on:
  push:
    branches: [store]
    paths: ['native/**', 'js/**', 'css/**', 'data/**', 'index.html', '.github/workflows/android.yml']
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: native } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - run: npm ci
      - run: node build-web.js && npx cap sync android
      - run: cd android && chmod +x gradlew && ./gradlew --no-daemon assembleDebug bundleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: genogram-android
          path: |
            native/android/app/build/outputs/apk/debug/*.apk
            native/android/app/build/outputs/bundle/release/*.aab
