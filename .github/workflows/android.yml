# Builds the Google Play version of Genogram on GitHub's servers (store branch only; the website is not affected).
# Result: Actions tab > latest "Android build" run > Artifacts > genogram-android (a test .apk and an unsigned .aab).
name: Android build
on:
  push:
    branches: [store]
    paths: ['native/**', 'js/**', 'css/**', 'data/**', 'index.html', '.github/workflows/android.yml']
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: native } }
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 22 }
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: 21 }
      - run: npm ci
      - run: node build-web.js && npx cap sync android
      - run: cd android && chmod +x gradlew && ./gradlew --no-daemon assembleDebug bundleRelease
      - name: Check the app (bundled files, app ID, target API)
        run: |
          APK=android/app/build/outputs/apk/debug/app-debug.apk
          unzip -l $APK | grep -E "assets/public/(index.html|js/native.js|js/app.js)"
          unzip -l $APK | grep -q assets/public/js/native.js
          AAPT=$(ls $ANDROID_HOME/build-tools/*/aapt2 | tail -1)
          $AAPT dump badging $APK | grep -E "^package:|targetSdkVersion|uses-permission"
          $AAPT dump badging $APK | grep -q "name='com.isaymotion.genogram'"
          $AAPT dump badging $APK | grep -q "targetSdkVersion:'36'"
      - uses: actions/upload-artifact@v5
        with:
          name: genogram-android
          path: |
            native/android/app/build/outputs/apk/debug/*.apk
            native/android/app/build/outputs/bundle/release/*.aab
